<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钉钉机器人对话 - 一键开启</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#eef4ff 0%,#f8faff 50%,#eef9ff 100%);
    min-height:100vh; display:flex; justify-content:center; align-items:center;
  }
  .container { text-align:center; padding:24px; }
  .logo-wrap { display:flex; justify-content:center; margin-bottom:24px; }
  .logo {
    width:88px; height:88px; border-radius:24px; background:linear-gradient(135deg,#1587ff,#0f6ed6);
    display:flex; align-items:center; justify-content:center; box-shadow:0 12px 32px rgba(21,135,255,.35);
  }
  .logo svg { width:52px; height:52px; }
  h1 { font-size:26px; color:#1f2329; margin-bottom:8px; font-weight:600; }
  .sub { color:#8a919f; font-size:15px; margin-bottom:36px; }
  .card {
    background:#fff; border-radius:20px; padding:40px 44px; max-width:460px; margin:0 auto;
    box-shadow:0 12px 40px rgba(31,35,41,.08); border:1px solid rgba(21,135,255,.08);
  }
  .btn-main {
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(135deg,#1587ff,#0f6ed6); color:#fff; border:none; border-radius:14px;
    padding:16px 44px; font-size:17px; font-weight:600; cursor:pointer; width:100%;
    box-shadow:0 8px 24px rgba(21,135,255,.35); transition:all .2s ease;
  }
  .btn-main:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(21,135,255,.45); }
  .btn-main:active { transform:translateY(0); }
  .btn-main:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .btn-main .spin {
    width:18px; height:18px; border:2.5px solid rgba(255,255,255,.35);
    border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; display:none;
  }
  .btn-main.loading .spin { display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .steps { margin-top:32px; text-align:left; }
  .step { display:flex; align-items:flex-start; gap:12px; padding:10px 0; }
  .step-num {
    width:26px; height:26px; border-radius:50%; background:#eef4ff; color:#1587ff;
    font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .step-text { font-size:14px; color:#4e5969; line-height:1.6; }
  .step-text b { color:#1f2329; }
  .footer { margin-top:28px; color:#a9b0bb; font-size:12px; }
  .toast {
    position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-80px);
    background:#fff; color:#1f2329; padding:12px 24px; border-radius:12px; font-size:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.15); transition:transform .3s ease; z-index:99;
    border-left:4px solid #e5484d;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  /* 调试面板样式 */
  .debug-panel {
    margin: 24px auto 0; max-width: 460px; background:#fff; border-radius:16px;
    padding:20px 24px; box-shadow:0 8px 30px rgba(31,35,41,.08);
    border:1px dashed #c0c8d4; text-align:left;
  }
  .debug-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .debug-head span { font-size:14px; font-weight:600; color:#1f2329; }
  .debug-copy {
    background:#eef4ff; color:#1587ff; border:none; border-radius:8px;
    padding:6px 14px; font-size:12px; cursor:pointer;
  }
  .debug-copy:hover { background:#dcebff; }
  .debug-body { font-size:12px; color:#4e5969; }
  .debug-row { margin-bottom:8px; }
  .debug-label { color:#8a919f; }
  .debug-value { color:#1587ff; font-weight:600; word-break:break-all; }
  .debug-value.has-value { color:#00b578; }
  .debug-raw {
    background:#f8f9fc; border-radius:8px; padding:10px 12px; font-size:11px;
    color:#4e5969; max-height:180px; overflow:auto; white-space:pre-wrap; word-break:break-all;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.5 2 2 5.58 2 10c0 2.5 1.4 4.7 3.6 6.2L4.5 21l4.6-2.6c.9.25 1.9.37 2.9.37 5.5 0 10-3.58 10-8s-4.5-7.77-10-7.77z" fill="#fff"/>
        <circle cx="8" cy="10" r="1.3" fill="#0f6ed6"/><circle cx="12" cy="10" r="1.3" fill="#0f6ed6"/><circle cx="16" cy="10" r="1.3" fill="#0f6ed6"/>
      </svg>
    </div>
  </div>
  <h1>钉钉机器人对话</h1>
  <div class="sub">点击下方按钮，授权后自动打开钉钉机器人会话</div>

  <div class="card">
    <button id="launchBtn" class="btn-main">
      <span class="spin"></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.5 2 2 5.58 2 10c0 2.5 1.4 4.7 3.6 6.2L4.5 21l4.6-2.6c.9.25 1.9.37 2.9.37 5.5 0 10-3.58 10-8s-4.5-7.77-10-7.77z" fill="#fff"/>
      </svg>
      立即授权并打开机器人对话
    </button>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text">点击按钮，弹出<b>钉钉授权窗口</b>，确认授权</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text">系统识别您的<b>用户唯一标识</b>并建立机器人会话</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text">自动唤起钉钉，打开与<b>机器人</b>的对话界面</div>
      </div>
    </div>
  </div>

  <div class="footer">登录即代表同意钉钉授权协议 · 数据仅用于创建机器人会话</div>
</div>

<div id="toast" class="toast"></div>

<!-- ✅ 调试面板：查看/复制从回调捕获的 chatbotUserId -->
<div class="debug-panel" id="debugPanel" style="display:none;">
  <div class="debug-head">
    <span>🔧 机器人ID 调试面板</span>
    <button id="copyChatbotId" class="debug-copy">复制 chatbotUserId</button>
  </div>
  <div class="debug-body">
    <div class="debug-row">
      <span class="debug-label">当前已保存的 chatbotUserId：</span>
      <span id="savedId" class="debug-value">（未捕获）</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">最近一次回调消息体（含 chatbotUserId）：</span>
    </div>
    <pre id="lastCallback" class="debug-raw">（暂无回调记录）</pre>
  </div>
</div>

<script>
const launchBtn = document.getElementById('launchBtn');
const toast = document.getElementById('toast');
const debugPanel = document.getElementById('debugPanel');
const copyBtn = document.getElementById('copyChatbotId');
const savedIdEl = document.getElementById('savedId');
const lastCallbackEl = document.getElementById('lastCallback');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// 加载当前已捕获的 chatbotUserId 与最近回调
async function loadChatbotId() {
  try {
    const resp = await fetch('/api/chatbot-id');
    const data = await resp.json();
    debugPanel.style.display = 'block';
    if (data.chatbotUserId) {
      savedIdEl.textContent = data.chatbotUserId;
      savedIdEl.classList.add('has-value');
    } else {
      savedIdEl.textContent = '（未捕获）';
    }
    if (data.lastCallback) {
      lastCallbackEl.textContent = JSON.stringify(data.lastCallback, null, 2);
    } else {
      lastCallbackEl.textContent = '（暂无回调记录）';
    }
  } catch (err) {
    console.error('加载 chatbotUserId 失败', err);
  }
}

// 复制 chatbotUserId
copyBtn.addEventListener('click', async () => {
  const id = savedIdEl.textContent.trim();
  if (!id || id === '（未捕获）') {
    showToast('尚未捕获到 chatbotUserId，请先在钉钉给机器人发一条消息');
    return;
  }
  try {
    await navigator.clipboard.writeText(id);
    showToast('已复制：' + id);
  } catch (err) {
    // 剪贴板 API 失败时降级
    const ta = document.createElement('textarea');
    ta.value = id;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制：' + id);
  }
});

// 页面加载时自动检查
loadChatbotId();

launchBtn.addEventListener('click', async () => {
  launchBtn.classList.add('loading');
  launchBtn.disabled = true;
  try {
    // ① 请求后端获取授权跳转链接
    const resp = await fetch('/api/auth/dingtalk-login');
    const data = await resp.json();
    if (!data.authUrl) throw new Error('未获取到授权地址');
    // ② 跳转钉钉授权窗口（整页跳转，避免第三方 Cookie 被浏览器拦截）
    window.location.href = data.authUrl;
  } catch (err) {
    console.error(err);
    showToast('获取授权地址失败：' + err.message);
    launchBtn.classList.remove('loading');
    launchBtn.disabled = false;
  }
});
</script>
</body>
</html>
